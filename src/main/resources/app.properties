# Enhanced Personal Finance Analyzer Configuration Properties
# Database Configuration
db.url=jdbc:sqlite:data/finance.db

# Logging Configuration
log.level=INFO
log.file=logs/app.log
log.file.limit=1048576
log.file.count=5

# Financial & Alert Thresholds
currency.symbol=\u20B9
alert.warning.threshold=80
alert.critical.threshold=100

# Background Scheduler Interval
recurring.check.interval.minutes=5

# Default Seed Categories
default.categories.expense=Food & Dining,Transport,Rent,Utilities,Shopping,Health,Entertainment,Education,Other
default.categories.income=Salary,Investment,Business,Gift,Other Income

# Fixed Expense Categories (comma-separated names; seeded per-user on registration)
# These are excluded from discretionary recommendations.
default.fixed.categories=Rent,Utilities
